<header class="app-header" data-app-header>
  <div class="app-header-inner">
    {% include "partials/screen_brand.html" %}
    <nav aria-label="Account"><details class="account" data-menu>
      <summary>
        <span class="avatar" aria-hidden="true">{% if user.name %}{{ user.name[0] | upper }}{% else %}{{ user.email[0] | upper }}{% endif %}</span>
        <span class="account-name hide-sm">{{ user.name }}</span>
        <span class="visually-hidden">Account</span>
        <svg class="icon icon-sm" aria-hidden="true"><use href="/static/img/icons.svg#i-chevron-down"/></svg>
      </summary>
      <div class="menu">
        <div class="menu-head">
          <div class="menu-name truncate">{{ user.name }}</div>
          <div class="menu-email truncate">{{ user.email }}</div>
        </div>
        <a class="menu-item" href="/projects">Your websites</a>
        <form method="post" action="/logout">
          <button class="menu-item" type="submit">
            <svg class="icon icon-sm" aria-hidden="true"><use href="/static/img/icons.svg#i-sign-out"/></svg>
            Sign out
          </button>
        </form>
      </div>
    </details></nav>
  </div>
</header>
