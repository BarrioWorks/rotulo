<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#E8E8EC">
  <link rel="preload" href="/static/fonts/onest-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
  {% block styles %}<link rel="stylesheet" href="/static/css/screens.css">{% endblock styles %}
  <script type="module" src="/static/js/app.js"></script>
  {% block head %}{% endblock head %}
  <title>{% if seo is defined %}{{ seo.title }}{% else %}{% block title %}Pagehaven{% endblock title %}{% endif %}</title>
  <meta name="robots" content="{% if seo is defined %}{{ seo.robots }}{% else %}noindex, nofollow{% endif %}">
  {% if seo is defined %}
  <meta name="description" content="{{ seo.description }}">
  <link rel="canonical" href="{{ seo.canonical }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pagehaven">
  <meta property="og:title" content="{{ seo.title }}">
  <meta property="og:description" content="{{ seo.description }}">
  <meta property="og:url" content="{{ seo.canonical }}">
  <meta property="og:image" content="{{ seo_pages.image }}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Pagehaven. Edit your HTML website without code.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ seo.title }}">
  <meta name="twitter:description" content="{{ seo.description }}">
  <meta name="twitter:image" content="{{ seo_pages.image }}">
  <meta name="twitter:image:alt" content="Pagehaven. Edit your HTML website without code.">
  {% endif %}
</head>
<body class="{% block body_class %}{% endblock body_class %}">
<a class="skip-link" href="#{% block skip_target %}main{% endblock skip_target %}">Skip to content</a>
{% block body %}{% endblock body %}
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
