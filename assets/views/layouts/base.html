<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F4F3EF">
  <title>{% block title %}Pagehaven{% endblock title %}</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/schibsted-grotesk-400-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/app.css">
  {% block styles %}<link rel="stylesheet" href="/static/css/screens.css">{% endblock styles %}
  <script type="module" src="/static/js/app.js"></script>
  {% block head %}{% endblock head %}
</head>
<body class="{% block body_class %}{% endblock body_class %}">
<a class="skip-link" href="#{% block skip_target %}main{% endblock skip_target %}">Skip to content</a>
{% block body %}{% endblock body %}
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
