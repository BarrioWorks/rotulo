logger:
  enable: true
  pretty_backtrace: true
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  format: compact

server:
  port: <%= get_env(name="PORT", default="5150") %>
  binding: <%= get_env(name="BINDING", default="127.0.0.1") %>
  host: http://127.0.0.1:5150
  middlewares:
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
      fallback: "assets/static/404.html"
    fallback:
      enable: false

workers:
  mode: BackgroundAsync

database:
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://pagehaven_development.sqlite?mode=rwc") %>
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 60000
  min_connections: 1
  max_connections: 4
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

settings:
  app_origin: <%= get_env(name="PAGEHAVEN_APP_ORIGIN", default="http://127.0.0.1:5150") %>
  scheme: http
  public_port: <%= get_env(name="PORT", default="5150") %>
  sites_domain: sites.localhost
  preview_domain: preview.localhost
  data_dir: <%= get_env(name="PAGEHAVEN_DATA_DIR", default="data") %>
  secret: <%= get_env(name="PAGEHAVEN_SECRET", default="development-only-secret-not-for-production-use") %>
  secure_cookies: false
  dns_over_https: https://cloudflare-dns.com/dns-query
  server_ipv4: 127.0.0.1
  abuse_email: abuse@pagehaven.example
  limits:
    upload_bytes: 26214400
    content_bytes: 104857600
    file_count: 2000
    depth: 15
    file_bytes: 20971520
    compression_ratio: 200
    image_bytes: 8388608
    projects_per_user: 25
    concurrent_jobs: 2
